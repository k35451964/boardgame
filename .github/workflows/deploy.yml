name: GitHub Pages 배포

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          VITE_BASE: /${{ github.event.repository.name }}/
          # 연결이 잘 안 되는 환경을 위한 TURN 서버 (선택). 저장소 Settings > Secrets and variables > Actions > Variables 에 넣으면 쓰인다.
          VITE_TURN_URLS: ${{ vars.VITE_TURN_URLS }}
          VITE_TURN_USERNAME: ${{ vars.VITE_TURN_USERNAME }}
          VITE_TURN_CREDENTIAL: ${{ vars.VITE_TURN_CREDENTIAL }}
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
